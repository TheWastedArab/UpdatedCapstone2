name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bugtracker
          POSTGRES_PASSWORD: bugtracker
          POSTGRES_DB: bugtracker_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bugtracker" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app ml scripts tests
      - name: Tests on SQLite (coverage must stay at or above 70%, NFR-13)
        run: pytest
      # Runs before the PostgreSQL tests: they create the tables directly, and
      # the migrations must be applied to an empty database.
      - name: Migrations apply and match the models
        env:
          BT_DATABASE_URL: postgresql+psycopg://bugtracker:bugtracker@localhost:5432/bugtracker_test
        run: |
          alembic upgrade head
          alembic check
      - name: Tests on PostgreSQL
        env:
          BT_TEST_DATABASE_URL: postgresql+psycopg://bugtracker:bugtracker@localhost:5432/bugtracker_test
        run: pytest --no-cov
      - name: OpenAPI document is up to date (DC-05)
        env:
          BT_DATABASE_URL: sqlite://
        run: |
          python -m app.cli export-openapi /tmp/openapi.json
          diff /tmp/openapi.json ../docs/openapi.json

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run compile
      - run: npx vsce package --no-dependencies --allow-missing-repository

  # Snyk (Section 1.6.4). Each scan is its own step, so one finding does not hide the
  # others. The Python packages are installed first: Snyk reads the installed versions,
  # and without them it would skip every package and still pass.
  snyk:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      # The CLI first, so Snyk Code still runs if a project dependency fails to install.
      - name: Install Snyk CLI
        if: ${{ env.SNYK_TOKEN != '' }}
        run: npm install -g snyk
      - name: Install dependencies
        if: ${{ env.SNYK_TOKEN != '' }}
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt
          (cd extension && npm ci)
      - name: Snyk Open Source, backend
        if: ${{ env.SNYK_TOKEN != '' && !cancelled() }}
        run: snyk test --file=backend/requirements.txt --package-manager=pip --command=python --policy-path=backend
      - name: Snyk Open Source, extension
        if: ${{ env.SNYK_TOKEN != '' && !cancelled() }}
        run: snyk test --file=extension/package-lock.json --dev
      # Report-only: the remaining findings were reviewed as false positives (docs/EVALUATION.md,
      # Security) and Snyk Code has no per-finding ignore, so they are printed but do not fail
      # the job. The dependency scans above stay blocking.
      - name: Snyk Code (static analysis and secrets)
        if: ${{ env.SNYK_TOKEN != '' && !cancelled() }}
        continue-on-error: true
        run: snyk code test
